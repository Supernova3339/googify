<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>goog</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #161618;
      color: #ccc;
      width: 210px;
      padding: 10px 12px 12px;
      margin: 0;
    }

    .imgs {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: center;
      padding: 8px 0 10px;
      border-bottom: 1px solid #2a2a2a;
      margin-bottom: 10px;
    }

    .imgs div {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .imgs img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .imgs span {
      font-size: 10px;
      color: #555;
      font-family: monospace;
    }

    label {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 3px 0;
      cursor: pointer;
      color: #bbb;
      line-height: 1.4;
    }

    label:hover { color: #ddd; }

    input[type=checkbox] {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
      accent-color: #888;
      cursor: pointer;
      margin: 0;
    }

    .warn { font-size: 11px; color: #666; }

    .link {
      display: block;
      margin-top: 9px;
      font-size: 11px;
      color: #555;
      cursor: pointer;
      border-top: 1px solid #2a2a2a;
      padding-top: 8px;
    }

    .link:hover { color: #999; }

    body.off label:not(:first-of-type),
    body.off .imgs { opacity: 0.4; }
  </style>
</head>
<body>
  <div class="imgs">
    <div>
      <img id="googImg" alt="" />
      <span>:goog:</span>
    </div>
    <div>
      <img id="evilImg" alt="" />
      <span>:evilgoog:</span>
    </div>
  </div>

  <label>
    <input type="checkbox" id="enabled" />
    enabled
  </label>

  <label>
    <input type="checkbox" id="bareWord" />
    <span>bare-word <span class="warn">(replaces goog without colons)</span></span>
  </label>

  <label>
    <input type="checkbox" id="maximumGoog" />
    <span>maximum :goog: <span class="warn">(every word)</span></span>
  </label>

  <span class="link" id="settingsLink">aliases & settings →</span>

  <script type="module" src="./main.ts"></script>
</body>
</html>
