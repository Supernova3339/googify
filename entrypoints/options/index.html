<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>goog — settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      background: #161618;
      color: #ccc;
      padding: 32px 24px 60px;
      margin: 0;
      max-width: 480px;
    }

    h2 {
      font-size: 13px;
      font-weight: 600;
      color: #888;
      margin: 0 0 14px;
    }

    .entry {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 32px;
    }

    .entry img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .entry .right { flex: 1; min-width: 0; }

    .entry strong {
      display: block;
      font-family: monospace;
      font-size: 14px;
      color: #ddd;
      margin-bottom: 10px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 8px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #222;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 2px 6px 2px 8px;
      font-family: monospace;
      font-size: 12px;
      color: #aaa;
    }

    .tag button {
      background: none;
      border: none;
      cursor: pointer;
      color: #555;
      font-size: 12px;
      padding: 0 1px;
      line-height: 1;
    }

    .tag button:hover { color: #e05c5c; }

    .none { font-size: 12px; color: #444; }

    .add-row {
      display: flex;
      gap: 6px;
    }

    .add-row input {
      flex: 1;
      background: #1e1e20;
      border: 1px solid #333;
      border-radius: 5px;
      color: #ccc;
      font-family: monospace;
      font-size: 12px;
      padding: 5px 8px;
      outline: none;
    }

    .add-row input:focus { border-color: #555; }
    .add-row input::placeholder { color: #444; }

    .add-row button {
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 5px;
      color: #aaa;
      font-size: 12px;
      padding: 5px 12px;
      cursor: pointer;
    }

    .add-row button:hover { background: #333; color: #ddd; }

    hr {
      border: none;
      border-top: 1px solid #222;
      margin: 0 0 24px;
    }

    .settings label {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 12px;
      cursor: pointer;
      line-height: 1.5;
    }

    .settings input[type=checkbox] {
      width: 14px;
      height: 14px;
      margin-top: 2px;
      flex-shrink: 0;
      accent-color: #888;
      cursor: pointer;
    }

    .settings .note {
      display: block;
      font-size: 12px;
      color: #555;
      margin-top: 1px;
    }

    #status {
      position: fixed;
      bottom: 16px;
      left: 24px;
      font-size: 12px;
      color: #555;
      opacity: 0;
      transition: opacity 0.2s;
    }

    #status.show { opacity: 1; }
  </style>
</head>
<body>
  <h2>:goog:</h2>
  <div class="entry">
    <img id="googImg" alt="" />
    <div class="right">
      <strong>:goog:</strong>
      <div class="tags" id="googTags"></div>
      <div class="add-row">
        <input id="googInput" type="text" placeholder="add alias" spellcheck="false" />
        <button id="googAdd">add</button>
      </div>
    </div>
  </div>

  <h2>:evilgoog:</h2>
  <div class="entry">
    <img id="evilImg" alt="" />
    <div class="right">
      <strong>:evilgoog:</strong>
      <div class="tags" id="evilTags"></div>
      <div class="add-row">
        <input id="evilInput" type="text" placeholder="add alias" spellcheck="false" />
        <button id="evilAdd">add</button>
      </div>
    </div>
  </div>

  <hr />

  <div class="settings">
    <label>
      <input type="checkbox" id="enabled" />
      <span>
        enabled
        <span class="note">turn off to pause all replacements</span>
      </span>
    </label>
    <label>
      <input type="checkbox" id="bareWord" />
      <span>
        bare-word mode
        <span class="note">also fires on goog without colons — will replace mid-sentence</span>
      </span>
    </label>
    <label>
      <input type="checkbox" id="maximumGoog" />
      <span>
        maximum :goog:
        <span class="note">replaces every single word on the page with :goog: — chaotic</span>
      </span>
    </label>
  </div>

  <div id="status"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
